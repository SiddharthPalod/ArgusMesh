[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
time = { version = "0.3", features = ["serde"] }
sled = "0.34"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
lru = "0.12"
async-trait = "0.1"
btleplug = "0.11.8"
futures = "0.3.31"
sha2 = "0.10"
zeroize = "1"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
once_cell = "1"
serde_json = "1"
libc = "0.2"
log = "0.4"
android_logger = "0.13"
